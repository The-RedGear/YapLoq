name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Verify Windows UI functions and dialogs
        shell: powershell
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tests/test_wpf_functions.ps1
      - name: Verify responsive page layouts
        shell: powershell
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tests/smoke_wpf.ps1
      - name: Verify update window and installer scripts
        shell: powershell
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tests/test_updates_ui.ps1
      - name: Verify automation workspace
        shell: powershell
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tests/test_automations_ui.ps1
      - name: Verify viewer assignments
        shell: powershell
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tests/test_viewers_ui.ps1
      - name: Verify global Save and pending drafts
        shell: powershell
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tests/test_global_save_ui.ps1
      - name: Verify unsaved-change protection
        shell: powershell
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tests/test_unsaved_changes_ui.ps1
      - name: Verify live settings and Discard
        shell: powershell
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tests/test_live_settings_ui.ps1
